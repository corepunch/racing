name: Racing
options:
  bundleIdPrefix: com.racing
  deploymentTarget:
    iOS: "16.0"
  defaultConfig: Debug

settings:
  SUPPORTED_INTERFACE_ORIENTATIONS: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
  SUPPORTED_INTERFACE_ORIENTATIONS_IPAD: "UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"

targets:
  Racing:
    type: application
    platform: iOS
    sources:
      - path: Sources/Racing
        excludes:
          - "**/.DS_Store"
      - path: Resources/Assets.xcassets
      - path: Resources/PrivacyInfo.xcprivacy
        buildPhase: resources
    preBuildScripts:
      - name: Copy Resources
        basedOnDependencyAnalysis: false
        script: |
          set -e
          copy_folder() {
            local src="$SRCROOT/Resources/$1"
            local dst="$BUILT_PRODUCTS_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/$1"
            mkdir -p "$dst"
            rsync -a --delete "$src/" "$dst/"
          }
          copy_folder "Audio"
        outputFiles:
          - "$(BUILT_PRODUCTS_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/Audio"
    settings:
      INFOPLIST_FILE: Resources/Info.plist
      PRODUCT_BUNDLE_IDENTIFIER: com.corepunch.arcline
      PRODUCT_BUNDLE_IDENTIFIER[sdk=macosx*]: com.racing.app.desktop
      TARGETED_DEVICE_FAMILY: "1,2"
      SUPPORTS_MACCATALYST: "YES"
      SWIFT_VERSION: "5.9"
      ENABLE_PREVIEWS: "YES"
